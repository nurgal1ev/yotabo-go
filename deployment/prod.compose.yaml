version: "3.8"

services:
  app:
    build:
      context: ../
      dockerfile: ./deployment/Dockerfile
      target: runner_dev
    ports:
      - "0.0.0.0:8080:8080"
    env_file:
      - ../.env
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  postgres_data: